name: Build and Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Patch
        env:
          A79003: ${{ secrets.A79003 }}
          B264B7: ${{ secrets.B264B7 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A79003', '')
          env_b = os.environ.get('B264B7', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 55c2e31f41c86fcf14ab331f68c3b380997255eba6 -->', env_a)
          if env_b:
              result = result.replace('<!-- 219820bbe6dd1a0936b09a2bd0002a -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
